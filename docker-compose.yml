# Local full-stack dev loop: PostgreSQL + Spring Boot API.
# Flyway runs the migrations in backend/src/main/resources/db/migration on API startup.
#
#   docker compose up --build
#   API:      http://localhost:8080/api/v1/facilities
#   Frontend: cd frontend && npm run dev:live   (proxies /api to :8080)

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: medlift
      POSTGRES_USER: medlift
      POSTGRES_PASSWORD: medlift
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medlift -d medlift"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/medlift
      DB_USER: medlift
      DB_PASSWORD: medlift
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:4173
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "8080:8080"

volumes:
  pgdata:
